# Netlify Configuration for Sai Lakshmi Elusuri Portfolio & Career Assets
# Target Domain: https://sailakshminl.netlify.app

[build]
  publish = "dist"
  command = "python3 build.py"

# Enforce HTTPS, HSTS, and Clean Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self';"

# Optimized Caching for Static PDF CVs, ZIP Archive, and CSS
[[headers]]
  for = "/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
    Content-Disposition = "inline"

[[headers]]
  for = "/*.zip"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
    Content-Disposition = "attachment; filename=\"Netherlands_Career_Hub_Sai_Lakshmi.zip\""

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Redirect rules
[[redirects]]
  from = "/resume"
  to = "/Sai_Lakshmi_Elusuri_Resume.pdf"
  status = 302

[[redirects]]
  from = "/cv"
  to = "/cv_power_bi_developer.pdf"
  status = 302

[[redirects]]
  from = "/pm-cv"
  to = "/cv_bi_project_delivery.pdf"
  status = 302

[[redirects]]
  from = "/hub"
  to = "/index.html"
  status = 301
